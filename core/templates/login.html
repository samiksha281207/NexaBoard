<!DOCTYPE html>
<html>
<head>
    <title>Login - NexaBoard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 30px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5d9df;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #3498db;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #2980b9;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 14px;
        }

        .register-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
        .password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 45px;
}

.toggle-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    cursor: pointer;
    font-size: 18px;
}
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">NexaBoard</div>

    <div class="subtitle">
        Login to your account
    </div>

    <form method="POST" autocomplete="off">

        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                autocomplete="off"
                required
            >
        </div>

        <div class="form-group">
    <label>Password</label>

    <div class="password-wrapper">
        <input
            type="password"
            name="password"
            id="loginPassword"
            placeholder="Enter Password"
            autocomplete="new-password"
            required
        >

        <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
            👁
        </button>
    </div>
</div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="/accounts/register/">Register</a>
    </div>

</div>
<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "🙈";
    } else {
        input.type = "password";
        button.textContent = "👁";
    }
}
</script>
</body>
</html>
