<!DOCTYPE html>
<html>
<head>
    <title>Add Task - NexaBoard</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <div class="sidebar">

    <h2>NexaBoard</h2>

    <a href="/">
        <span class="sidebar-icon">⌂</span>
        <span>Dashboard</span>
    </a>

    <a href="/projects/">
        <span class="sidebar-icon">▣</span>
        <span>Projects</span>
    </a>

    <a href="/add-project/">
        <span class="sidebar-icon">＋</span>
        <span>Add Project</span>
    </a>

    <a href="/tasks/" class="active">
        <span class="sidebar-icon">☑</span>
        <span>Tasks</span>
    </a>

    <a href="/team/">
        <span class="sidebar-icon">♙</span>
        <span>Team</span>
    </a>

    <a href="/logout/" class="logout-btn">
        <span class="sidebar-icon">↪</span>
        Logout
    </a>

</div>

<div class="header">
    <h1>Add New Task</h1>
    <p>Create a new task</p>
</div>

<div class="container">

    <div class="card form-card">
        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Add Task</button>

        </form>

    </div>

</div>

<br>

<center>
    <a href="/tasks/">
        <button>⬅ Back to Tasks</button>
    </a>
</center>

</body>
</html>
